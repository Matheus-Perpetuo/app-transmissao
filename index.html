<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transmissão - Discord Style</title>
  <link rel="stylesheet" href="style.css">
  <!-- SDK Oficial do LiveKit para Navegador -->
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>
<body>
  <div class="container">
    
    <!-- TELA 1: LOBBY -->
    <div id="tela-lobby" class="card">
      <h1>🎮 Transmissão de Tela</h1>
      <p>Conecte-se para assistir ou compartilhar seu jogo com amigos.</p>

      <div class="form-group">
        <label for="input-nome">Seu Apelido:</label>
        <input type="text" id="input-nome" placeholder="Ex: Lucas" maxlength="20">
      </div>

      <div class="form-group">
        <label for="input-id-sala">Nome da Sala:</label>
        <input type="text" id="input-id-sala" placeholder="Ex: sala-dos-cria">
      </div>

      <div class="botoes-lobby">
        <button id="btn-entrar-sala" class="btn btn-primary">Entrar / Criar Sala</button>
      </div>
    </div>

    <!-- TELA 2: DENTRO DA SALA -->
    <div id="tela-sala" class="card esconde">
      <div class="header-sala">
        <h2>Sala: <span id="display-id-sala">---</span></h2>
        <button id="btn-copiar-id" class="btn btn-secondary">📋 Copiar Nome da Sala</button>
      </div>

      <div class="conteudo-sala">
        <!-- ÁREA DO VÍDEO -->
        <div class="area-video">
          <video id="player-video" autoplay playsinline controls></video>
          <div id="status-transmissao" class="overlay-status">
            <p>Ninguém está transmitindo a tela no momento.</p>
          </div>
        </div>

        <!-- BARRA LATERAL: PARTICIPANTES -->
        <div class="sidebar-participantes">
          <h3>Participantes (<span id="contador-users">0</span>)</h3>
          <ul id="lista-participantes" class="lista-usuarios"></ul>
          
          <div class="controles-midia">
            <button id="btn-transmitir" class="btn btn-primary">🎥 Transmitir Tela</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
