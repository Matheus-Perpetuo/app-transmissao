<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmissão - AppStyle</title>
    <link rel="stylesheet" href="style.css">

    <!-- SDK Oficial do LiveKit para Navegador -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>

<body>

    <div id="versao-app">v1.0.0</div>

    <div class="container">

        <!-- =====================================================
             TELA 0: AUTENTICAÇÃO
             ===================================================== -->

        <div id="tela-autenticacao" class="card">

            <h1>🔐 Acesso</h1>

            <p>
                Digite seu código de acesso para continuar.
            </p>

            <div class="form-group">

                <label for="input-codigo">
                    Código de acesso:
                </label>

                <input
                    type="text"
                    id="input-codigo"
                    placeholder="Ex: MATHEUS-7K29-XP4Q"
                    maxlength="50"
                    autocomplete="off"
                >

            </div>

            <div class="botoes-lobby">

                <button
                    id="btn-autenticar"
                    class="btn btn-primary"
                >
                    🔓 Acessar
                </button>

            </div>

            <p
                id="status-autenticacao"
                class="status-autenticacao esconde"
            ></p>

        </div>


        <!-- =====================================================
             TELA 1: LOBBY
             ===================================================== -->

        <div
            id="tela-lobby"
            class="card esconde"
        >

            <h1>🎮 Transmissão de Tela</h1>

            <p>
                Conecte-se para assistir ou compartilhar seu jogo com amigos.
            </p>


            <div class="form-group">

                <label for="input-nome">
                    Seu Apelido:
                </label>

                <input
                    type="text"
                    id="input-nome"
                    placeholder="Ex: K.KSlider"
                    maxlength="20"
                >

            </div>


            <div class="form-group">

                <label for="input-id-sala">
                    Nome da Sala:
                </label>

                <input
                    type="text"
                    id="input-id-sala"
                    placeholder="Ex: sala-dos-amigos"
                >

            </div>


            <div class="botoes-lobby">

                <button
                    id="btn-entrar-sala"
                    class="btn btn-primary"
                >
                    Entrar / Criar Sala
                </button>

            </div>

        </div>


        <!-- =====================================================
             TELA 2: DENTRO DA SALA
             ===================================================== -->

        <div
            id="tela-sala"
            class="card esconde"
        >

            <div class="header-sala">

                <h2>
                    Sala:
                    <span id="display-id-sala">---</span>
                </h2>

                <button
                    id="btn-copiar-id"
                    class="btn btn-secondary"
                >
                    📋 Copiar Nome da Sala
                </button>

            </div>


            <div class="conteudo-sala">

                <!-- ÁREA DO VÍDEO -->

                <div class="area-video">

                    <video
                        id="player-video"
                        autoplay
                        playsinline
                        controls
                    ></video>

                    <div
                        id="status-transmissao"
                        class="overlay-status"
                    >

                        <p>
                            Ninguém está transmitindo a tela no momento.
                        </p>

                    </div>

                </div>


                <!-- BARRA LATERAL -->

                <div class="sidebar-participantes">

                    <h3>
                        Participantes
                        (
                        <span id="contador-users">
                            0
                        </span>
                        )
                    </h3>


                    <ul
                        id="lista-participantes"
                        class="lista-usuarios"
                    ></ul>


                    <!-- CONTROLES DE MÍDIA -->

                    <div class="controles-midia">

                        <div
                            id="box-qualidade"
                            class="form-group-qualidade"
                        >

                            <label for="select-qualidade">
                                Qualidade da Transmissão:
                            </label>

                            <select
                                id="select-qualidade"
                                class="input-select"
                            >

                                <option value="720p30">
                                    720p - 30 FPS (Padrão)
                                </option>

                                <option value="1080p30">
                                    1080p - 30 FPS (Alta)
                                </option>

                                <option value="1080p60">
                                    1080p - 60 FPS (Jogos/Nitro)
                                </option>

                            </select>

                        </div>


                        <button
                            id="btn-transmitir"
                            class="btn btn-primary"
                        >
                            🎥 Transmitir Tela
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
